<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="registration-card">
    
    <h1>Student Registration</h1>
    
    <form id="studentForm">

      <label for="nameInput">Name:</label>
      <input type="text" id="nameInput" placeholder="Enter your name">
      
      <label for="courseInput">Course:</label>
      <input type="text" id="courseInput" placeholder="Enter your course">

      <button type="submit">Register</button>
    </form>

    <h2 id="welcomeMessage"></h2>
      <button type="button" id="toggleTheme">Toggle Theme</button>
  </div>

  <script src="script.js"></script>

</body>
</html>

### 1. Why is event.preventDefault() necessary when handling form submissions?

Answer: event.preventDefault() is necessary because it stops the page from reloading.

### 2. How does classList.toggle() simplify dynamic theme switching?

Answer: classList,toggle() simplifies dynamic theme switching because it is easy to switch betweeen light and dark themes.

### 3. What is the practical difference between the input and keydown event listeners?

Answer: The input event works when you type, while keydown event works when you press a key, like Escape.
